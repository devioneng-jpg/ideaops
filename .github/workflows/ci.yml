name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall app

      - name: Run tests
        # Tests mock all LLM/DB calls; no secrets required (see tests/conftest.py).
        run: python -m pytest -q
